# 推送 v* tag 自动构建 Windows 版并在 GitHub Releases 发布；workflow_dispatch 仅验证构建不发布
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIP_NAME: oWakaka-windows-x64-${{ github.ref_name }}.zip

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/oWakaka.exe -DestinationPath $env:ZIP_NAME

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true

      - name: Upload artifact (test build only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

[package]
name = "oWakaka"
version = "0.1.0"
edition = "2024"

[lib]
name = "o_wakaka"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
